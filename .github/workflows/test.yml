name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Supersede in-flight runs for the same ref; a stale matrix is never the answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        uv sync --all-extras

    # --no-cache: a warm ruff cache has been observed reporting stale results
    # after files change. CI is cheap; determinism is worth more here.
    - name: Ruff (lint)
      run: |
        uv run ruff check --no-cache src/ tests/ examples/

    - name: Ruff (format)
      run: |
        uv run ruff format --check --no-cache src/ tests/ examples/

  types:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        uv sync --all-extras

    - name: Mypy
      run: |
        uv run mypy src/finslerax

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Catches packaging rot — a bad manifest, an unbuildable sdist, or README
    # markup that PyPI would reject — before a release does.
    - name: Build sdist and wheel
      run: |
        uv build

    - name: Check distribution metadata
      run: |
        uvx twine check dist/*

  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the other precision/python combos when one fails — we want
      # to see f32 vs f64 results independently.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        # Numerical precision matrix: run the whole suite in both float32 and
        # float64 so float64 support cannot silently rot (see finslerax.utils.config).
        jax-x64: ["0", "1"]

    name: py${{ matrix.python-version }} x64=${{ matrix.jax-x64 }}

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-extras

    - name: Run tests with pytest
      env:
        JAX_PLATFORMS: cpu
        # Precision is selected by JAX's native flag, read at `import jax`.
        JAX_ENABLE_X64: ${{ matrix.jax-x64 }}
      run: |
        uv run pytest tests/ -v --timeout=300
