[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hamtools"
version = "1.0.0"
description = "A differentiable library for learnable Finsler Geometry and Holonomic Association Models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Balázs Attila Hubicska" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "equinox>=0.10.0",
    "optax>=0.1.0",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "matplotlib",
    "jupyter",
    "plotly",
    "mypy",
    "ruff",
]
viz = [
    # ham.vis: matplotlib/plotly are imported at module level.
    "matplotlib>=3.5",
    "plotly>=5.0",
]
wildfire = [
    "Pillow>=9.0",
    "rasterio>=1.3",
]
gpu = [
    # Install CUDA 12 accelerated jaxlib. Requires NVIDIA GPU + CUDA 12 drivers.
    # See https://jax.readthedocs.io/en/latest/installation.html for alternatives
    # (CUDA 11, ROCm, TPU).
    "jax[cuda12]>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/hubibala/ham"
Bug_Tracker = "https://github.com/hubibala/ham/issues"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Module already imported so cannot be rewritten. (fast_array_utils|jaxtyping|zarr):pytest.PytestAssertRewriteWarning",
]

[tool.mypy]
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "scratch",
    "results_"
]

[tool.ruff]
line-length = 88
# Walkthrough notebooks are generated from build_notebook.py scripts (which ARE
# linted); their cells follow notebook idiom (top-of-cell imports after path
# bootstrap, exploratory names), so they are excluded from the gate.
extend-exclude = ["*.ipynb"]
# Kept at py39 deliberately: bumping to py310 triggers a large unrelated
# pyupgrade sweep (Optional[X] -> X | None, collections.abc imports). Modernise
# in a dedicated pass. (Package support is float-tested at >=3.10; see CI.)
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
    "N",
    "C4",
]
ignore = [
    "E731", # lambda-assignment (idiomatic for small JAX field/metric closures)
    "N802", # invalid-function-name (often used for math)
    "N803", # invalid-argument-name (often used for matrices like X)
    "N806", # non-lowercase-variable-in-function (often used for matrices)
    "E501", # line-too-long (let formatter handle this)
    "E741", # ambiguous-variable-name (I, l are common in math)
    "N815", # mixed-case-variable-in-class-scope (eps_G, max_G are fine)
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "RUF012", # mutable-class-default
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ham*"]