[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finslerax"
version = "1.0.0"
description = "Differentiable Finsler geometry in JAX."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Balázs Hubicska" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "equinox>=0.10.0",
    "optax>=0.1.0",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "matplotlib",
    "jupyter",
    "plotly",
    "mypy",
    "ruff",
]
viz = [
    # finslerax.vis: matplotlib/plotly are imported at module level.
    "matplotlib>=3.5",
    "plotly>=5.0",
]
gpu = [
    # Install CUDA 12 accelerated jaxlib. Requires NVIDIA GPU + CUDA 12 drivers.
    # See https://jax.readthedocs.io/en/latest/installation.html for alternatives
    # (CUDA 11, ROCm, TPU).
    "jax[cuda12]>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/hubibala/finslerax"
Bug_Tracker = "https://github.com/hubibala/finslerax/issues"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Module already imported so cannot be rewritten. (fast_array_utils|jaxtyping|zarr):pytest.PytestAssertRewriteWarning",
]

[tool.mypy]
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "scratch",
    "results_"
]

# Equinox modules are dataclasses, and FinslerMetric declares `spray_reg` with a
# default. Every subclass field therefore "follows an attribute with a default",
# which mypy reports even though it cannot happen at runtime: these classes
# define their own __init__, so Equinox never generates the positional one whose
# ordering rule is being checked. Scoped to the metric-defining modules; real
# [misc] errors elsewhere are still reported.
[[tool.mypy.overrides]]
module = [
    "finslerax.geometry.zoo.*",
    "finslerax.models.*",
    "finslerax.solvers.mesh_eikonal",
    "finslerax.utils.terrain",
]
disable_error_code = ["misc"]

[tool.ruff]
line-length = 88
# Walkthrough notebooks are generated from build_notebook.py scripts (which ARE
# linted); their cells follow notebook idiom (top-of-cell imports after path
# bootstrap, exploratory names), so they are excluded from the gate.
extend-exclude = ["*.ipynb"]
# Matches requires-python: the package supports 3.10+.
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
    "N",
    "C4",
]
ignore = [
    "E731", # lambda-assignment (idiomatic for small JAX field/metric closures)
    "N802", # invalid-function-name (often used for math)
    "N803", # invalid-argument-name (often used for matrices like X)
    "N806", # non-lowercase-variable-in-function (often used for matrices)
    "E501", # line-too-long (let formatter handle this)
    "E741", # ambiguous-variable-name (I, l are common in math)
    "N815", # mixed-case-variable-in-class-scope (eps_G, max_G are fine)
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "RUF012", # mutable-class-default
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["src"]
include = ["finslerax*"]
